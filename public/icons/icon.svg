<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0c1830"/>
      <stop offset="60%" stop-color="#070f1f"/>
      <stop offset="100%" stop-color="#03060f"/>
    </radialGradient>
    <linearGradient id="needleN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="needleS" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- accent halo -->
  <circle cx="256" cy="256" r="170" fill="#3b82f6" opacity="0.08"/>
  <circle cx="256" cy="256" r="120" fill="#3b82f6" opacity="0.07"/>

  <!-- bezel ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#bezel)" stroke-width="7" opacity="0.9"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.10"/>

  <!-- tick marks -->
  <g stroke="#60a5fa" stroke-linecap="round">
    <!-- cardinals: longer, brighter -->
    <g stroke-width="7" opacity="0.95">
      <line x1="256" y1="76" x2="256" y2="104"/>
      <line x1="256" y1="76" x2="256" y2="104" transform="rotate(90 256 256)"/>
      <line x1="256" y1="76" x2="256" y2="104" transform="rotate(180 256 256)"/>
      <line x1="256" y1="76" x2="256" y2="104" transform="rotate(270 256 256)"/>
    </g>
    <!-- minors -->
    <g stroke-width="4" opacity="0.40">
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(30 256 256)"/>
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(60 256 256)"/>
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(120 256 256)"/>
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(150 256 256)"/>
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(210 256 256)"/>
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(240 256 256)"/>
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(300 256 256)"/>
      <line x1="256" y1="80" x2="256" y2="98" transform="rotate(330 256 256)"/>
    </g>
  </g>

  <!-- needle (pointing NE) -->
  <g transform="rotate(45 256 256)">
    <!-- south half (silver) -->
    <polygon points="256,414 286,262 256,236 226,262" fill="url(#needleS)"/>
    <polygon points="256,414 286,262 256,262" fill="#0f172a" opacity="0.35"/>
    <!-- north half (accent, glowing) -->
    <polygon points="256,98 286,250 256,276 226,250" fill="url(#needleN)" filter="url(#glow)"/>
    <polygon points="256,98 286,250 256,250" fill="#0c1e4a" opacity="0.30"/>
  </g>

  <!-- hub -->
  <circle cx="256" cy="256" r="34" fill="#070f1f" stroke="#3b82f6" stroke-width="7"/>
  <circle cx="256" cy="256" r="11" fill="#bfdbfe"/>

  <!-- monogram -->
  <text x="256" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="5" fill="#93c5fd" text-anchor="middle">ENDO</text>
</svg>
